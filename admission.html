<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Nova College - Admission</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 20px;
            min-height: 100vh;
            font-family: Arial, sans-serif;

            background: linear-gradient(
                135deg,
                #eaf2ff,
                #ffffff
            );

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 650px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.12);
        }

        h1 {
            text-align: center;

            color: #123b70;

            margin-top: 0;
            margin-bottom: 30px;
        }

        label {
            display: block;

            margin-top: 15px;
            margin-bottom: 7px;

            font-weight: bold;

            color: #333;
        }

        input,
        select {
            width: 100%;

            padding: 13px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus,
        select:focus {
            border-color: #1769d1;

            box-shadow:
                0 0 0 3px
                rgba(23, 105, 209, 0.1);
        }

        .payment-section {
            margin-top: 25px;

            padding: 20px;

            border-radius: 12px;

            background: #f5f8ff;

            border: 1px solid #d9e5ff;
        }

        .payment-title {
            margin: 0 0 8px 0;

            color: #123b70;

            font-size: 19px;
        }

        .fee {
            margin: 0 0 18px 0;

            font-size: 17px;

            font-weight: bold;

            color: #333;
        }

        .payment-options {
            display: flex;

            gap: 12px;
        }

        .payment-option {
            flex: 1;

            padding: 15px;

            border: 2px solid #ccc;

            border-radius: 10px;

            background: white;

            color: #333;

            cursor: pointer;

            text-align: center;

            font-weight: bold;

            transition: 0.2s;
        }

        .payment-option:hover {
            border-color: #1769d1;
        }

        .payment-option.selected {
            border-color: #1769d1;

            background: #eaf2ff;

            color: #1769d1;
        }

        .payment-option input {
            display: none;
        }

        .payment-icon {
            display: block;

            font-size: 25px;

            margin-bottom: 7px;
        }

        button {
            width: 100%;

            margin-top: 25px;

            padding: 14px;

            border: none;

            border-radius: 8px;

            background: #1769d1;

            color: white;

            font-size: 17px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.2s;
        }

        button:hover {
            background: #0f4f9f;
        }

        button:disabled {
            background: #888;

            cursor: not-allowed;
        }

        #message {
            text-align: center;

            margin-top: 18px;

            font-weight: bold;

            line-height: 1.5;
        }

        .login-link {
            text-align: center;

            margin-top: 22px;
        }

        .login-link a {
            color: #1769d1;

            font-weight: bold;

            text-decoration: none;
        }

        .login-link a:hover {
            text-decoration: underline;
        }

        @media (max-width: 500px) {

            body {
                padding: 10px;
            }

            .container {
                padding: 22px;
            }

            .payment-options {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Nova College Admission</h1>

        <form id="admissionForm">

            <!-- FULL NAME -->

            <label for="name">
                Full Name
            </label>

            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                autocomplete="name"
                required
            >


            <!-- EMAIL -->

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                autocomplete="email"
                required
            >


            <!-- PASSWORD -->

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Minimum 6 characters"
                minlength="6"
                autocomplete="new-password"
                required
            >


            <!-- PHONE -->

            <label for="phone">
                Phone
            </label>

            <input
                type="tel"
                id="phone"
                placeholder="03XX-XXXXXXX"
                autocomplete="tel"
                required
            >


            <!-- COURSE -->

            <label for="course">
                Select Course
            </label>

            <select id="course" required>

                <option value="">
                    Choose a course
                </option>

                <option value="Computer Science">
                    Computer Science
                </option>

                <option value="Pre-medical">
                    Pre-medical
                </option>

                <option value="Pre-Engineering">
                    Pre-Engineering
                </option>

            </select>


            <!-- PAYMENT -->

            <div class="payment-section">

                <h2 class="payment-title">
                    Admission Fee
                </h2>

                <p class="fee">
                    Rs. 5,000
                </p>

                <label>
                    Select Payment Method
                </label>

                <div class="payment-options">

                    <!-- JAZZCASH -->

                    <label
                        class="payment-option"
                        id="jazzcashOption"
                    >

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="jazzcash"
                        >

                        <span class="payment-icon">
                            📱
                        </span>

                        JazzCash

                    </label>


                    <!-- EASYPAISA -->

                    <label
                        class="payment-option"
                        id="easypaisaOption"
                    >

                        <input
                            type="radio"
                            name="paymentMethod"
                            value="easypaisa"
                        >

                        <span class="payment-icon">
                            💳
                        </span>

                        Easypaisa

                    </label>

                </div>

            </div>


            <!-- SUBMIT -->

            <button
                type="submit"
                id="submitButton"
            >
                Submit Application & Pay
            </button>

        </form>


        <!-- MESSAGE -->

        <p id="message"></p>


        <!-- LOGIN -->

        <div class="login-link">

            Already have an account?

            <a href="loginform.html">
                Login here
            </a>

        </div>

    </div>


    <script>

        // ==========================================
        // GET HTML ELEMENTS
        // ==========================================

        const form =
            document.getElementById("admissionForm");

        const message =
            document.getElementById("message");

        const button =
            document.getElementById("submitButton");

        const jazzcashOption =
            document.getElementById("jazzcashOption");

        const easypaisaOption =
            document.getElementById("easypaisaOption");


        // ==========================================
        // PAYMENT METHOD SELECTION
        // ==========================================

        const paymentOptions =
            document.querySelectorAll(
                'input[name="paymentMethod"]'
            );

        paymentOptions.forEach(function(option) {

            option.addEventListener(
                "change",
                function() {

                    jazzcashOption.classList.remove(
                        "selected"
                    );

                    easypaisaOption.classList.remove(
                        "selected"
                    );


                    if (this.value === "jazzcash") {

                        jazzcashOption.classList.add(
                            "selected"
                        );

                    }


                    if (this.value === "easypaisa") {

                        easypaisaOption.classList.add(
                            "selected"
                        );

                    }

                }
            );

        });


        // ==========================================
        // SUBMIT ADMISSION FORM
        // ==========================================

        form.addEventListener(
            "submit",
            async function(event) {

                event.preventDefault();


                // ======================================
                // GET FORM VALUES
                // ======================================

                const name =
                    document
                        .getElementById("name")
                        .value
                        .trim();

                const email =
                    document
                        .getElementById("email")
                        .value
                        .trim();

                const password =
                    document
                        .getElementById("password")
                        .value;

                const phone =
                    document
                        .getElementById("phone")
                        .value
                        .trim();

                const course =
                    document
                        .getElementById("course")
                        .value;


                // ======================================
                // GET PAYMENT METHOD
                // ======================================

                const selectedPayment =
                    document.querySelector(
                        'input[name="paymentMethod"]:checked'
                    );


                if (!selectedPayment) {

                    message.textContent =
                        "Please select JazzCash or Easypaisa.";

                    message.style.color = "red";

                    return;
                }


                const paymentMethod =
                    selectedPayment.value;


                // ======================================
                // ADMISSION FEE
                // ======================================

                const amount = 5000;


                // ======================================
                // PASSWORD VALIDATION
                // ======================================

                if (password.length < 6) {

                    message.textContent =
                        "Password must be at least 6 characters.";

                    message.style.color = "red";

                    return;
                }


                // ======================================
                // DISABLE BUTTON
                // ======================================

                button.disabled = true;

                button.textContent =
                    "Submitting...";

                message.textContent =
                    "Submitting your application...";

                message.style.color = "#555";


                // ======================================
                // SEND DATA TO NODE.JS
                // ======================================

                try {

                    const response =
                        await fetch(
                            "/api/register",
                            {
                                method: "POST",

                                headers: {
                                    "Content-Type":
                                        "application/json"
                                },

                                body:
                                    JSON.stringify({

                                        name: name,

                                        email: email,

                                        password: password,

                                        phone: phone,

                                        course: course,

                                        paymentMethod:
                                            paymentMethod,

                                        amount: amount

                                    })
                            }
                        );


                    // ==================================
                    // CHECK SERVER RESPONSE
                    // ==================================

                    const data =
                        await response.json();


                    if (!response.ok) {

                        throw new Error(
                            data.message ||
                            "Server returned HTTP " +
                            response.status
                        );
                    }


                    // ==================================
                    // SUCCESS
                    // ==================================

                    if (data.success) {


                        // Save student information
                        // for payment.html

                        localStorage.setItem(
                            "admissionPayment",

                            JSON.stringify({

                                name: name,

                                email: email,

                                phone: phone,

                                course: course,

                                paymentMethod:
                                    paymentMethod,

                                amount: amount,

                                studentId:
                                    data.student.id

                            })
                        );


                        message.textContent =
                            "Application submitted successfully! Opening payment page...";

                        message.style.color =
                            "green";


                        console.log(
                            "Registered student:",
                            data.student
                        );


                        // ==================================
                        // GO TO PAYMENT PAGE
                        // ==================================

                        setTimeout(
                            function() {

                                window.location.href =
                                    "payment.html";

                            },
                            1000
                        );


                    } else {

                        message.textContent =
                            data.message ||
                            "Registration failed.";

                        message.style.color =
                            "red";


                        button.disabled =
                            false;

                        button.textContent =
                            "Submit Application & Pay";

                    }

                }


                // ======================================
                // CONNECTION ERROR
                // ======================================

                catch (error) {

                    console.error(
                        "Registration Error:",
                        error
                    );


                    message.textContent =
                        "Cannot connect to server. Make sure Node.js is running.";

                    message.style.color =
                        "red";


                    button.disabled =
                        false;

                    button.textContent =
                        "Submit Application & Pay";

                }

            }
        );

    </script>

</body>

</html>
