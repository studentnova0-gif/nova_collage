<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nova College - Admission</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
            background: #f5f5f5;
        }

        .container {
            max-width: 700px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-top: 15px;
            margin-bottom: 5px;
            font-weight: bold;
        }

        input,
        select {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: 16px;
        }

        input:focus,
        select:focus {
            outline: none;
            border-color: #0066cc;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 13px;
            border: none;
            border-radius: 5px;
            background: #222;
            color: white;
            font-size: 16px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button:disabled {
            background: #888;
            cursor: not-allowed;
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 16px;
            font-weight: bold;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            color: #0066cc;
            text-decoration: none;
            font-weight: bold;
        }

        .login-link a:hover {
            text-decoration: underline;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1>Nova College Admission</h1>

        <form id="admissionForm">

            <!-- Full Name -->
            <label for="name">Full Name</label>
            <input
                type="text"
                id="name"
                placeholder="Enter your full name"
                required
            >

            <!-- Email -->
            <label for="email">Email</label>
            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <!-- Password -->
            <label for="password">Password</label>
            <input
                type="password"
                id="password"
                placeholder="Create a password (minimum 6 characters)"
                minlength="6"
                required
            >

            <!-- Phone -->
            <label for="phone">Phone</label>
            <input
                type="tel"
                id="phone"
                placeholder="Enter your phone number"
                required
            >

            <!-- Course -->
            <label for="course">Select Course</label>
            <select id="course" required>
                <option value="">Choose a course</option>
                <option value="Computer Science">Computer Science</option>
                <option value="Pre-medical">Pre-medical</option>
                <option value="Pre-Enginaring">Pre-Engiaring</option>
            </select>

            <!-- Submit -->
            <button type="submit" id="submitButton">
                Submit Application
            </button>

        </form>

        <p id="message"></p>

        <div class="login-link">
            Already have an account?
            <a href="loginform(2).html">Login here</a>
        </div>

    </div>


    <script>

        const admissionForm = document.getElementById("admissionForm");
        const message = document.getElementById("message");
        const submitButton = document.getElementById("submitButton");

        admissionForm.addEventListener("submit", async function(event) {

            event.preventDefault();

            // Get form values
            const name = document.getElementById("name").value.trim();
            const email = document.getElementById("email").value.trim();
            const password = document.getElementById("password").value;
            const phone = document.getElementById("phone").value.trim();
            const course = document.getElementById("course").value;


            // Check password
            if (password.length < 6) {

                message.textContent =
                    "Password must be at least 6 characters.";

                message.style.color = "red";

                return;
            }


            // Show loading
            submitButton.disabled = true;
            submitButton.textContent = "Submitting...";

            message.textContent = "Submitting your application...";
            message.style.color = "#555";


            try {

                // Send data to Node.js
                const response = await fetch("http://localhost:5000/api/register", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify({

                        name: name,
                        email: email,
                        password: password,

                        // These are collected for your form.
                        // Your current register API uses name/email/password.
                        phone: phone,
                        course: course

                    })

                });


                const data = await response.json();


                // Success
                if (data.success) {

                    message.textContent =
                        "Application submitted successfully!";

                    message.style.color = "green";

                    admissionForm.reset();

                    submitButton.disabled = false;
                    submitButton.textContent = "Submit Application";


                    // Go to login after 2 seconds
                    setTimeout(function() {

                        window.location.href = "loginform(2).html";

                    }, 2000);

                }

                // Error from server
                else {

                    message.textContent = data.message;
                    message.style.color = "red";

                    submitButton.disabled = false;
                    submitButton.textContent = "Submit Application";

                }


            } catch (error) {

                console.error("Registration Error:", error);

                message.textContent =
                    "Cannot connect to server. Make sure Node.js is running.";

                message.style.color = "red";

                submitButton.disabled = false;
                submitButton.textContent = "Submit Application";

            }

        });

    </script>

</body>

</html>
