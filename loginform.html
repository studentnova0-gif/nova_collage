<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Nova College - Student Login</title>

    <style>

        * {
            box-sizing: border-box;
        }

        body {

            margin: 0;

            min-height: 100vh;

            font-family: Arial, sans-serif;

            background:
                linear-gradient(
                    135deg,
                    #eaf2ff,
                    #ffffff
                );

            display: flex;

            justify-content: center;

            align-items: center;
        }

        .login-box {

            width: 90%;

            max-width: 400px;

            background: white;

            padding: 35px;

            border-radius: 18px;

            box-shadow:
                0 15px 40px
                rgba(0, 0, 0, 0.12);
        }

        h2 {

            text-align: center;

            color: #123b70;

            margin-bottom: 25px;
        }

        label {

            display: block;

            margin-bottom: 7px;

            font-weight: bold;
        }

        input {

            width: 100%;

            padding: 13px;

            margin-bottom: 18px;

            border: 1px solid #ccc;

            border-radius: 8px;

            font-size: 16px;

            outline: none;
        }

        input:focus {

            border-color: #1769d1;

            box-shadow:
                0 0 0 3px
                rgba(23, 105, 209, 0.1);
        }

        button {

            width: 100%;

            padding: 14px;

            background: #1769d1;

            color: white;

            border: none;

            border-radius: 8px;

            cursor: pointer;

            font-size: 17px;

            font-weight: bold;
        }

        button:hover {

            background: #0f4f9f;
        }

        button:disabled {

            background: #888;

            cursor: not-allowed;
        }

        #message {

            text-align: center;

            margin-top: 18px;

            font-weight: bold;
        }

        .admission-link {

            text-align: center;

            margin-top: 20px;
        }

        .admission-link a {

            color: #1769d1;

            text-decoration: none;

            font-weight: bold;
        }

    </style>

</head>

<body>

    <div class="login-box">

        <h2>
            Student Login
        </h2>

        <form id="loginForm">

            <label for="email">
                Email
            </label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

            <label for="password">
                Password
            </label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <button
                type="submit"
                id="loginButton"
            >
                Login
            </button>

        </form>

        <p id="message"></p>

        <div class="admission-link">

            Don't have an account?

            <a href="admission.html">
                Apply now
            </a>

        </div>

    </div>

    <script>document.addEventListener("DOMContentLoaded", function () {

    const loginForm = document.getElementById("loginForm");

    if (!loginForm) {
        console.error("❌ loginForm not found");
        return;
    }

    loginForm.addEventListener("submit", async function (event) {

        event.preventDefault();

        const emailInput = document.getElementById("email");
        const passwordInput = document.getElementById("password");

        const message =
            document.getElementById("message") ||
            document.getElementById("loginMessage");

        const loginButton =
            loginForm.querySelector('button[type="submit"]');

        const email = emailInput.value.trim();
        const password = passwordInput.value;

        if (!email || !password) {

            if (message) {
                message.textContent =
                    "Please enter email and password.";
                message.style.color = "red";
            }

            return;
        }

        // Disable button
        if (loginButton) {
            loginButton.disabled = true;
            loginButton.textContent = "Logging in...";
        }

        if (message) {
            message.textContent = "";
        }

        try {

            const response = await fetch("/api/login", {
                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })
            });

            const data = await response.json();

            console.log("LOGIN RESPONSE:", data);

            if (!response.ok || !data.success) {

                throw new Error(
                    data.message ||
                    "Login failed."
                );
            }

            // ==========================================
            // LOGIN SUCCESS
            // ==========================================

            console.log(
                "✅ LOGIN SUCCESS:",
                data.student
            );

            // Save student information
            localStorage.setItem(
                "student",
                JSON.stringify(data.student)
            );

            // Show success message
            if (message) {
                message.textContent =
                    "Login successful!";
                message.style.color = "green";
            }

            // ==========================================
            // OPEN STUDENT DASHBOARD
            // ==========================================

            setTimeout(function () {

                window.location.href =
                    "/dashboard.html";

            }, 500);

        } catch (error) {

            console.error(
                "❌ LOGIN ERROR:",
                error
            );

            if (message) {
                message.textContent =
                    error.message ||
                    "Login failed.";

                message.style.color = "red";
            }

            if (loginButton) {
                loginButton.disabled = false;
                loginButton.textContent = "Login";
            }
        }
    });
});</script>

</body>

</html>
